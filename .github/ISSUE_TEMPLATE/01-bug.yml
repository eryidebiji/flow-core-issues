name: 碰到问题
description: 用的时候哪里不对，或和你想的不一样
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你愿意写下来。先看看有没有人说过类似的事。账号、订单这些和个人相关的，走网站会更方便。
  - type: checkboxes
    id: searched
    attributes:
      label: 先看过了
      options:
        - label: 我先看过现有反馈，没有找到同一件事
          required: true
  - type: input
    id: core-version
    attributes:
      label: FLO.W Core 版本
      description: 在 Obsidian 设置里能看到，例如 1.0.5
      placeholder: 1.0.5
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本
      description: 设置里的「关于」能看到
      placeholder: 1.8.10
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 你在用的系统
      options:
        - macOS
        - Windows
        - iPhone
        - iPad
        - Android
        - 不止一个系统
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: 当时怎样
      description: 用你自己的话说清哪里别扭就好，不用写得很正式
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么碰到的
      description: 如果能一步步写下来，我会比较容易跟上
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你本来希望怎样
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 还可以补的
      description: 截图可以直接拖进来。如果里面有笔记内容或路径，遮一下就行
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开给大家看
      options:
        - label: 里面没有笔记原文、库的路径或订单信息，其他人看着也安心
          required: true
