name: 缺陷反馈
description: 功能异常，或和预期不一致
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先搜索有没有相同内容。账号、订单相关事项走网站。
  - type: checkboxes
    id: searched
    attributes:
      label: 搜索
      options:
        - label: 已搜索现有 Issue，没有相同内容
          required: true
  - type: input
    id: core-version
    attributes:
      label: FLO.W Core 版本
      description: 在 Obsidian 设置里可以看到，例如 1.0.5
      placeholder: 1.0.5
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本
      description: 设置里的「关于」可以看到
      placeholder: 1.8.10
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - macOS
        - Windows
        - iPhone
        - iPad
        - Android
        - 不止一个系统
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: 发生了什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 可以拖入截图。如有笔记内容或路径，先遮住
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容
      options:
        - label: 未包含笔记原文、库路径、订单号或验证码
          required: true
