name: 功能建议
description: 希望增加或调整的能力
title: "[功能] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        先搜索有没有相同建议。有的话在原条目下补充或点表情。
  - type: checkboxes
    id: searched
    attributes:
      label: 搜索
      options:
        - label: 已搜索现有 Issue，没有相同建议
          required: true
  - type: textarea
    id: want
    attributes:
      label: 希望怎样
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: 使用场合
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: 现在的做法
      description: 没有可以写「没有」
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容
      options:
        - label: 未包含笔记原文、库路径、订单号或验证码
          required: true
